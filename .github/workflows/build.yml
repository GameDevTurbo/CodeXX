name: Build Server

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller customtkinter

      - name: Install tkinter (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y python3-tk

      - name: Build Server executable
        run: pyinstaller --onefile --windowed --name CLIProxyAPI-Server launcher.py

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $pkg = "CLIProxyAPI-Server-Windows"
          mkdir $pkg; mkdir $pkg/docs
          cp dist/CLIProxyAPI-Server.exe, Server.bat, Client.bat, _bootstrap.ps1 $pkg/
          cp Server.command, Client.command $pkg/
          cp docker-compose.yml, prepare_offline.bat, README.md $pkg/
          cp docs/windows.md $pkg/docs/
          mkdir $pkg/auths, $pkg/logs, $pkg/plugins
          Compress-Archive -Path $pkg -DestinationPath CLIProxyAPI-Server-Windows.zip

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pkg="CLIProxyAPI-Server-macOS"
          mkdir -p $pkg/docs $pkg/auths $pkg/logs $pkg/plugins
          cp dist/CLIProxyAPI-Server $pkg/; chmod +x $pkg/CLIProxyAPI-Server
          cp Server.command Client.command start.sh $pkg/; chmod +x $pkg/Server.command $pkg/Client.command $pkg/start.sh
          cp docker-compose.yml prepare_offline.sh README.md $pkg/
          cp docs/macos.md $pkg/docs/
          zip -r CLIProxyAPI-Server-macOS.zip $pkg

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pkg="CLIProxyAPI-Server-Linux"
          mkdir -p $pkg/docs $pkg/scripts $pkg/auths $pkg/logs $pkg/plugins
          cp dist/CLIProxyAPI-Server $pkg/; chmod +x $pkg/CLIProxyAPI-Server
          cp start.sh prepare_offline.sh $pkg/; chmod +x $pkg/start.sh $pkg/prepare_offline.sh
          cp scripts/deploy.sh $pkg/scripts/; chmod +x $pkg/scripts/deploy.sh
          cp docker-compose.yml README.md $pkg/
          cp docs/linux.md $pkg/docs/
          zip -r CLIProxyAPI-Server-Linux.zip $pkg

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.name }}
          path: CLIProxyAPI-Server-${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## CLIProxyAPI Server ${{ github.ref_name }}

            下载对应平台 zip，解压后双击即可运行，**无需安装 Python**。

            | 平台 | 下载 | 启动方式 |
            |------|------|---------|
            | Windows | `CLIProxyAPI-Server-Windows.zip` | 双击 `Server.bat` 或 `.exe` |
            | macOS | `CLIProxyAPI-Server-macOS.zip` | 双击 `Server.command` |
            | Linux | `CLIProxyAPI-Server-Linux.zip` | `./CLIProxyAPI-Server` 或 `bash scripts/deploy.sh` |

            ### 客户端工具

            使用端（其他设备连接此服务）请使用：
            **[CLIProxyAPI-Client](https://github.com/GameDevTurbo/CodeXX-Client/releases)**

            ### 离线部署

            在有网机器运行 `prepare_offline.bat`（Windows）或 `prepare_offline.sh`（Mac/Linux），
            然后将整个文件夹复制到目标机器，运行：
            ```
            docker load -i offline_deps/cli-proxy-api-image.tar
            ```
          files: dist/*.zip
