name: Build server
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: x64
            label: Windows-x64
          - os: macos-15-intel
            architecture: x64
            label: macOS-x64
          - os: macos-15
            architecture: arm64
            label: macOS-arm64
          - os: ubuntu-latest
            architecture: x64
            label: Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Install build dependencies
        run: python -m pip install pyinstaller -r requirements.txt
      - name: Install Linux Tk runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Check source
        run: python -m compileall -q launcher.py server_app scripts
      - name: Build and package native release
        run: python scripts/build_release.py --role server
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.label }}
          path: release/*
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Download the archive matching your OS and CPU architecture.
            Windows: open the EXE. macOS: open the App bundle.
            Python is bundled. Read AI_START.md for AI-assisted diagnosis.
            macOS bundles are not notarized; follow your organization's installation policy.
          files: release/*
