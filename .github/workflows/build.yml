name: Build Server

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo 'Tag does not match VERSION' >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
          - os: macos-15
            name: macOS-arm64
          - os: macos-15-intel
            name: macOS-x64
          - os: ubuntu-latest
            name: Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Install tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Isolated regression checks
        run: python -m unittest discover -s tests -v
      - name: Build and package
        run: python scripts/build_release.py --role server
      - name: Native CLI smoke checks
        run: python scripts/smoke_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.name }}
          path: |
            release/*.zip
            release/*.zip.sha256
          if-no-files-found: error
  offline:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [macOS-arm64, macOS-x64, Windows-x64, Linux-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: release
      - name: Prepare official installers, management page and target image
        run: python launcher.py --prepare-offline --target ${{ matrix.target }} --bundle-dir offline_deps/${{ matrix.target }}
      - name: Package verified offline bundle
        run: python scripts/package_offline.py --target ${{ matrix.target }} --bundle-dir offline_deps/${{ matrix.target }} --base-archive release/CLIProxyAPI-Server-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: offline-${{ matrix.target }}
          compression-level: 0
          path: |
            release/*-offline.zip
            release/*-offline.zip.sha256
          if-no-files-found: error
  release:
    if: github.event_name == 'push'
    needs: [version, build, offline]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            下载对应系统及 CPU 的 Server ZIP，并核对同名 .sha256。
            macOS 打开 CLIProxyAPI-Server.app 或 Server.command；Windows 打开 Server.bat；Linux 运行 CLIProxyAPI-Server。
            预编译包无需 Python，但仍需安装并启动 Docker Desktop（Linux 可用 Docker Engine + Compose）。
            推荐下载同平台 -offline.zip：Mac/Windows 内含官方 Docker/Tailscale 安装程序、服务镜像和管理面板；普通包支持应用内自动下载。
            离线包自动勾选离线部署，安装程序优先从包内打开；Linux 需预装 Docker Engine + Compose，Windows 的 WSL 等系统前置项需提前准备。
            上游 AI 调用、首次账号授权和 Tailscale 登录仍需要网络；离线指安装与镜像部署。
            首次安装的系统授权、钥匙串提示及上游账号登录需要用户在本机完成。
            详细流程和旧 v1.1.0 包排查见包内 docs/first-run.md；先检查连接再验证实际生成。
          files: |
            release/*.zip
            release/*.zip.sha256
