name: Build Server

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo 'Tag does not match VERSION' >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
          - os: macos-15
            name: macOS-arm64
          - os: macos-15-intel
            name: macOS-x64
          - os: ubuntu-latest
            name: Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Install tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Isolated regression checks
        run: python -m unittest discover -s tests -v
      - name: Build and package
        run: python scripts/build_release.py --role server
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.name }}
          path: |
            release/*.zip
            release/*.zip.sha256
          if-no-files-found: error
  release:
    if: github.event_name == 'push'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            下载对应系统及 CPU 的 Server ZIP，并核对同名 .sha256。
            macOS 打开 CLIProxyAPI-Server.app 或 Server.command；Windows 打开 Server.bat；Linux 运行 CLIProxyAPI-Server。
            预编译包无需 Python，但仍需安装并启动 Docker Desktop（Linux 可用 Docker Engine + Compose）。
            首次安装的系统授权、钥匙串提示及上游账号登录需要用户在本机完成。
            详细流程和旧 v1.1.0 包排查见包内 docs/first-run.md；先检查连接再验证实际生成。
          files: |
            release/*.zip
            release/*.zip.sha256
