name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller customtkinter

      - name: Install tkinter (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y python3-tk

      - name: Build Server tool
        run: pyinstaller --onefile --windowed --name CLIProxyAPI-Server launcher.py

      - name: Build Client tool
        run: pyinstaller --onefile --windowed --name CLIProxyAPI-Client client.py

      - name: Collect artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mv dist/CLIProxyAPI-Server.exe dist/CLIProxyAPI-Server-Windows.exe
          mv dist/CLIProxyAPI-Client.exe dist/CLIProxyAPI-Client-Windows.exe

      - name: Collect artifacts (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mv dist/CLIProxyAPI-Server dist/CLIProxyAPI-Server-macOS
          mv dist/CLIProxyAPI-Client dist/CLIProxyAPI-Client-macOS

      - name: Collect artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mv dist/CLIProxyAPI-Server dist/CLIProxyAPI-Server-Linux
          mv dist/CLIProxyAPI-Client dist/CLIProxyAPI-Client-Linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.name }}
          path: dist/CLIProxyAPI-*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## CLIProxyAPI ${{ github.ref_name }}

            下载对应平台的可执行文件，无需安装 Python。

            | 工具 | Windows | macOS | Linux |
            |------|---------|-------|-------|
            | **Server**（部署服务） | `CLIProxyAPI-Server-Windows.exe` | `CLIProxyAPI-Server-macOS` | `CLIProxyAPI-Server-Linux` |
            | **Client**（连接使用） | `CLIProxyAPI-Client-Windows.exe` | `CLIProxyAPI-Client-macOS` | `CLIProxyAPI-Client-Linux` |

            macOS/Linux 下载后需 `chmod +x` 再运行。
          files: dist/CLIProxyAPI-*
